<section class="card">
  <header class="card__header">
    <h3>Ventas recientes</h3>
    <span>Consulta ventas emitidas y accede a su detalle.</span>
  </header>

  @if (errorMessage) {
    <p-message severity="error" [text]="errorMessage"></p-message>
  }

  <p-table [value]="sales" [loading]="loading" [paginator]="true" [rows]="6" responsiveLayout="scroll" size="small">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Total</th>
        <th>Usuario</th>
        <th class="actions-cell">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-sale>
      <tr>
        <td>#{{ sale.id }}</td>
        <td>{{ sale.createdAt | date: 'short' }}</td>
        <td>
          <p-tag [severity]="sale.status === 'VOIDED' ? 'danger' : 'success'" [value]="sale.status"></p-tag>
        </td>
        <td>{{ sale.total | currency: 'USD' }}</td>
        <td>{{ sale.username || sale.userId || '-' }}</td>
        <td class="actions-cell">
          <p-button
            icon="pi pi-eye"
            [text]="true"
            ariaLabel="Ver detalle"
            (onClick)="viewDetail.emit(sale.id)"
          ></p-button>
          @if (canVoidSale(sale.status)) {
            <p-button
              icon="pi pi-times-circle"
              severity="danger"
              [text]="true"
              ariaLabel="Anular"
              (onClick)="voidSale.emit(sale.id)"
            ></p-button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
